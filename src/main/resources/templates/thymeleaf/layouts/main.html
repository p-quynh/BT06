<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">UTE Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/thymeleaf-category.css}">
</head>
<body>
<header class="site-header border-bottom bg-white">
    <div class="container py-3">
        <nav class="navbar navbar-expand-lg p-0">
            <a class="navbar-brand fw-bold text-primary" th:href="@{/home}">UTE SHOP</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mainNavigation" aria-controls="mainNavigation"
                    aria-expanded="false" aria-label="Mở menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavigation">
                <div class="navbar-nav me-auto">
                    <a class="nav-link" th:href="@{/home}">Trang chủ</a>
                    <a class="nav-link" th:href="@{/product}">Sản phẩm</a>
                    <a class="nav-link active" aria-current="page" th:href="@{/admin/category}">Danh mục</a>
                    <a class="nav-link" th:href="@{/admin/product}">Quản lý sản phẩm</a>
                </div>
                <div class="student-badge">
                    <img th:if="${session.account != null and session.account.avatar != null}"
                         th:src="@{/uploads/avatar/{file}(file=${session.account.avatar})}"
                         alt="Ảnh cá nhân">
                    <img th:unless="${session.account != null and session.account.avatar != null}"
                         th:src="@{/uploads/avatar/default-avt.jpg}"
                         alt="Ảnh cá nhân mặc định">
                    <div>
                        <strong th:text="${session.account != null ? session.account.fullname : studentName}">Họ và tên</strong>
                        <small th:text="${studentId}">MSSV</small>
                    </div>
                </div>
            </div>
        </nav>
    </div>
</header>

<main class="page-content">
    <div class="container py-5" layout:fragment="content">
        Nội dung trang
    </div>
</main>

<footer class="site-footer mt-auto">
    <div class="container py-4 d-flex flex-column flex-md-row justify-content-between gap-2">
        <div>
            <strong>Thông tin sinh viên thực hiện</strong>
            <div><span th:text="${studentName}">Họ và tên sinh viên</span> — <span th:text="${studentId}">MSSV</span></div>
        </div>
        <div class="text-md-end">
            <div th:text="${studentClassName}">Lớp học phần</div>
            <small>Spring Boot • Thymeleaf • Thymeleaf Layout Dialect</small>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
