<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{thymeleaf/layouts/main}">
<head>
    <title th:text="${formTitle}">Biểu mẫu danh mục</title>
</head>
<body>
<section layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <span class="eyebrow">Trang quản trị</span>
                    <h1 class="mb-4" th:text="${formTitle}">Biểu mẫu danh mục</h1>

                    <div th:if="${message}" class="alert alert-danger" th:text="${message}">Lỗi</div>

                    <form method="post" enctype="multipart/form-data"
                          th:action="@{/admin/category/save}" th:object="${category}">
                        <input type="hidden" th:field="*{cate_id}">
                        <input type="hidden" th:field="*{icons}">
                        <input type="hidden" name="csrfToken" th:value="${csrfToken}">

                        <div class="mb-3">
                            <label class="form-label" for="cate_name">Tên danh mục</label>
                            <input id="cate_name" type="text" class="form-control"
                                   th:classappend="${#fields.hasErrors('cate_name')} ? ' is-invalid'"
                                   th:field="*{cate_name}" maxlength="255" required autofocus>
                            <div class="invalid-feedback" th:errors="*{cate_name}">Lỗi tên danh mục</div>
                        </div>

                        <div th:if="*{icons != null and !icons.isBlank()}" class="mb-3">
                            <label class="form-label d-block">Ảnh hiện tại</label>
                            <img class="current-image"
                                 th:src="@{/uploads/categories/{file}(file=${category.icons})}"
                                 th:alt="${category.cate_name}">
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="iconsFile">Ảnh danh mục</label>
                            <input id="iconsFile" class="form-control" type="file" name="iconsFile"
                                   accept="image/jpeg,image/png,image/webp,image/gif">
                            <div class="form-text">JPG, PNG, WEBP hoặc GIF; tối đa 5 MB. Để trống khi muốn giữ ảnh cũ.</div>
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            <button class="btn btn-primary" type="submit">Lưu danh mục</button>
                            <a class="btn btn-outline-secondary" th:href="@{/admin/category}">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
