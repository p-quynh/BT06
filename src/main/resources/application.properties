# ===============================
# DATABASE SQL SERVER
# ===============================

server.port=${SERVER_PORT:8081}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1434;databaseName=ClothingShop;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# ===============================
# JSP
# ===============================

spring.mvc.view.prefix=/views/

spring.mvc.view.suffix=.jsp

# ===============================
# THYMELEAF (dùng riêng cho các view thymeleaf/*)
# ===============================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.view-names=thymeleaf/*

# Thay ba giá trị dưới đây bằng thông tin thật 
app.student.name=
app.student.id= 



# ===============================
# UPLOAD
# ===============================

spring.servlet.multipart.enabled=true

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=20MB
